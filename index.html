<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="家計簿">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>家計簿</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { color-scheme: light dark; }
  /* hidden を付けたものは必ず隠す（Tailwind の flex などに負けないように） */
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    padding-top: env(safe-area-inset-top);
    padding-bottom: calc(88px + env(safe-area-inset-bottom));   /* 下の切り替えタブの分をあける */
    -webkit-tap-highlight-color: transparent;
  }
  /* iPhone で入力時に拡大されないよう、入力欄は 16px 以上 */
  input, select, textarea { font-size: 16px !important; }
  .field {
    display: block; width: 100%; min-height: 44px; padding: 8px 12px;
    border-radius: 10px; border: 1px solid rgb(203 213 225); background: #fff; color: inherit;
  }
  .field:focus { outline: 2px solid rgb(14 165 233); outline-offset: 0; border-color: transparent; }
  textarea.field { min-height: 64px; resize: vertical; }
  input[type="date"].field { -webkit-appearance: none; appearance: none; }
  input[type="date"]::-webkit-date-and-time-value { text-align: left; }
  @media (prefers-color-scheme: dark) {
    .field { background: rgb(15 23 42); border-color: rgb(71 85 105); }
  }
  .tap { min-height: 44px; min-width: 44px; }
  .spin {
    display: inline-block; width: 1em; height: 1em; border-radius: 9999px;
    border: 2px solid currentColor; border-right-color: transparent;
    animation: spin .8s linear infinite; vertical-align: -0.15em;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .bar { transition: width .3s ease; }
  #toast { bottom: calc(80px + env(safe-area-inset-bottom)); }
  /* 画面下の切り替えタブ（家計簿／栄養管理） */
  #viewNav { padding-bottom: env(safe-area-inset-bottom); }
</style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 antialiased">

<!-- ===== 合言葉の入力画面 ===== -->
<section id="keyScreen" class="max-w-md mx-auto px-4 pt-16" hidden>
  <h1 class="text-2xl font-bold mb-3">家計簿</h1>
  <p id="keyMsg" class="text-sm text-slate-600 dark:text-slate-300 mb-4 leading-relaxed">
    はじめに合言葉を入力してください（Apps Script の setup を実行したときにログに出た32文字の英数字）。この端末に保存され、次からは入力不要です。
  </p>
  <form id="keyForm" class="grid gap-3">
    <input id="keyInput" class="field" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="合言葉">
    <button id="keyBtn" class="tap rounded-xl bg-sky-600 text-white font-bold px-4" type="submit">はじめる</button>
  </form>
</section>

<!-- ===== 本体 ===== -->
<div id="app" class="max-w-3xl mx-auto px-4" hidden>

  <header class="flex items-center justify-between pt-3 pb-2">
    <h1 id="appTitle" class="text-xl font-bold">家計簿</h1>
    <div class="flex items-center gap-2">
      <span id="syncState" class="text-xs text-slate-500 dark:text-slate-400"></span>
      <button id="settingsBtn" class="tap rounded-xl text-xl" type="button" aria-label="設定">⚙️</button>
    </div>
  </header>

  <!-- エラー表示 -->
  <div id="errorBox" class="mb-3 rounded-xl bg-red-50 text-red-700 dark:bg-red-950 dark:text-red-200 px-4 py-3 text-sm" hidden></div>

  <!-- 設定 -->
  <section id="settingsPanel" class="mb-4 rounded-2xl bg-white dark:bg-slate-800 shadow-sm p-4" hidden>
    <h2 class="font-bold mb-3">設定：1日の目標</h2>
    <form id="settingsForm" class="grid grid-cols-2 sm:grid-cols-4 gap-3">
      <label class="text-sm">kcal<input id="goalKcal" class="field mt-1" type="text" inputmode="numeric"></label>
      <label class="text-sm">P（g）<input id="goalP" class="field mt-1" type="text" inputmode="decimal"></label>
      <label class="text-sm">F（g）<input id="goalF" class="field mt-1" type="text" inputmode="decimal"></label>
      <label class="text-sm">C（g）<input id="goalC" class="field mt-1" type="text" inputmode="decimal"></label>
      <button id="settingsSave" class="tap col-span-2 sm:col-span-4 rounded-xl bg-sky-600 text-white font-bold" type="submit">目標を保存</button>
    </form>
    <hr class="my-4 border-slate-200 dark:border-slate-700">
    <button id="forgetBtn" class="tap w-full rounded-xl border border-red-300 text-red-600 dark:border-red-800 dark:text-red-300 text-sm" type="button">
      この端末から合言葉と控えを消す
    </button>
  </section>

  <!-- 月の切り替え（家計簿の画面） -->
  <div id="monthNav" class="flex items-center justify-between mb-3">
    <button id="prevMonth" class="tap rounded-xl bg-white dark:bg-slate-800 shadow-sm text-lg" type="button" aria-label="前の月">‹</button>
    <div id="monthLabel" class="text-lg font-bold"></div>
    <button id="nextMonth" class="tap rounded-xl bg-white dark:bg-slate-800 shadow-sm text-lg" type="button" aria-label="次の月">›</button>
  </div>

  <!-- 日の切り替え（栄養管理の画面） -->
  <div id="dayNav" class="flex items-center justify-between gap-2 mb-3" hidden>
    <button id="prevDay" class="tap rounded-xl bg-white dark:bg-slate-800 shadow-sm text-lg" type="button" aria-label="前の日">‹</button>
    <div class="flex items-center gap-2">
      <input id="dayPicker" class="field !w-auto font-bold" type="date" aria-label="表示する日">
      <button id="todayBtn" class="tap rounded-xl bg-white dark:bg-slate-800 shadow-sm text-sm px-3" type="button">今日</button>
    </div>
    <button id="nextDay" class="tap rounded-xl bg-white dark:bg-slate-800 shadow-sm text-lg" type="button" aria-label="次の日">›</button>
  </div>

  <!-- ダッシュボード -->
  <div class="mb-4">
    <!-- カード1：お金 -->
    <section id="moneyCard" class="rounded-2xl bg-white dark:bg-slate-800 shadow-sm p-4">
      <h2 id="moneyTitle" class="text-sm font-bold text-slate-500 dark:text-slate-400 mb-2">今月のお金</h2>
      <dl class="grid grid-cols-3 gap-2 text-center">
        <div><dt class="text-xs text-slate-500 dark:text-slate-400">収入</dt><dd id="sumIncome" class="font-bold text-base sm:text-lg tabular-nums"></dd></div>
        <div><dt class="text-xs text-slate-500 dark:text-slate-400">支出</dt><dd id="sumExpense" class="font-bold text-base sm:text-lg tabular-nums"></dd></div>
        <div><dt class="text-xs text-slate-500 dark:text-slate-400">収支</dt><dd id="sumBalance" class="font-bold text-base sm:text-lg tabular-nums"></dd></div>
      </dl>
    </section>

    <!-- カード2：カロリー -->
    <section id="mealCard" class="rounded-2xl bg-white dark:bg-slate-800 shadow-sm p-4" hidden>
      <h2 id="mealTitle" class="text-sm font-bold text-slate-500 dark:text-slate-400 mb-2">今日の摂取カロリー</h2>
      <div class="flex items-baseline justify-between">
        <div><span id="kcalTotal" class="text-2xl font-bold tabular-nums"></span><span class="text-sm text-slate-500 dark:text-slate-400"> / <span id="kcalGoal"></span> kcal</span></div>
        <div id="kcalLeft" class="text-xs"></div>
      </div>
      <div class="h-3 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden mt-1 mb-3">
        <div id="kcalBar" class="bar h-full rounded-full bg-sky-500" style="width:0%"></div>
      </div>
      <div id="pfcBars" class="grid gap-2"></div>
    </section>
  </div>

  <!-- 入力エリア -->
  <section id="inputArea" class="rounded-2xl bg-white dark:bg-slate-800 shadow-sm p-4 mb-4">
    <div id="editBar" class="mb-3 flex items-center justify-between rounded-xl bg-amber-50 text-amber-800 dark:bg-amber-950 dark:text-amber-200 px-3 py-1 text-sm" hidden>
      <span>✏️ 記録を編集中</span>
      <button id="editCancel" class="tap underline" type="button">やめる</button>
    </div>

    <!-- お金の入力 -->
    <form id="moneyForm" class="grid gap-3" novalidate>
      <div class="grid grid-cols-2 gap-2">
        <button id="kindExpense" class="tap rounded-xl font-bold border" type="button">支出</button>
        <button id="kindIncome" class="tap rounded-xl font-bold border" type="button">収入</button>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <label class="text-sm">日付<input id="mDate" class="field mt-1" type="date"></label>
        <label class="text-sm">カテゴリ<select id="mCat" class="field mt-1"></select></label>
      </div>
      <label class="text-sm">項目名<input id="mName" class="field mt-1" type="text" maxlength="100" placeholder="例：コンビニ、給与" enterkeyhint="next"></label>
      <label class="text-sm">金額（円）<input id="mAmount" class="field mt-1 tabular-nums" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="例：1200" enterkeyhint="done"></label>
      <label class="text-sm">メモ（任意）<input id="mMemo" class="field mt-1" type="text" maxlength="500"></label>
      <button id="moneySubmit" class="tap rounded-xl bg-sky-600 text-white font-bold disabled:opacity-60" type="submit">記録する</button>
    </form>

    <!-- 食事の入力 -->
    <form id="mealForm" class="grid gap-3" novalidate hidden>
      <div class="grid grid-cols-2 gap-3">
        <label class="text-sm">日付<input id="fDate" class="field mt-1" type="date"></label>
        <label class="text-sm">食事区分<select id="fCat" class="field mt-1"></select></label>
      </div>
      <label class="text-sm">項目名<input id="fName" class="field mt-1" type="text" maxlength="100" placeholder="例：コンビニ弁当" enterkeyhint="next"></label>
      <div class="grid grid-cols-3 gap-2">
        <label class="text-sm">P（g）<input id="fP" class="field mt-1 tabular-nums" type="text" inputmode="decimal"></label>
        <label class="text-sm">F（g）<input id="fF" class="field mt-1 tabular-nums" type="text" inputmode="decimal"></label>
        <label class="text-sm">C（g）<input id="fC" class="field mt-1 tabular-nums" type="text" inputmode="decimal"></label>
      </div>
      <label class="text-sm">kcal <span id="kcalHint" class="text-xs text-slate-500 dark:text-slate-400"></span>
        <input id="fKcal" class="field mt-1 tabular-nums" type="text" inputmode="numeric" placeholder="P・F・C を入れると自動で計算">
      </label>
      <div class="grid grid-cols-2 gap-3">
        <label class="text-sm">金額（任意・食費）<input id="fAmount" class="field mt-1 tabular-nums" type="text" inputmode="numeric" pattern="[0-9]*"></label>
        <label class="text-sm">メモ（任意）<input id="fMemo" class="field mt-1" type="text" maxlength="500"></label>
      </div>
      <button id="mealSubmit" class="tap rounded-xl bg-orange-500 text-white font-bold disabled:opacity-60" type="submit">記録する</button>
    </form>
  </section>

  <!-- PayPay の取り込み（家計簿の画面） -->
  <section id="importArea" class="mb-4">
    <button id="importOpen" class="tap w-full rounded-2xl border-2 border-dashed border-slate-300 dark:border-slate-600 text-sm font-bold text-slate-600 dark:text-slate-300" type="button">📥 PayPay の履歴を取り込む</button>
    <div id="importPanel" class="rounded-2xl bg-white dark:bg-slate-800 shadow-sm p-4" hidden>
      <div class="flex items-center justify-between mb-1">
        <h2 class="font-bold">PayPay の履歴を取り込む</h2>
        <button id="importClose" class="tap rounded-xl" type="button" aria-label="閉じる">✕</button>
      </div>
      <p class="text-xs text-slate-500 dark:text-slate-400 mb-3 leading-relaxed">
        PayPay アプリの「取引履歴」右上の「取引履歴のダウンロード」で保存した CSV ファイルを選んでください。
        同じ取引は二重には入りません。チャージは取り込みません。
      </p>
      <label class="tap flex items-center justify-center rounded-xl bg-sky-600 text-white font-bold cursor-pointer">
        ファイルを選ぶ
        <input id="importFile" type="file" accept=".csv,text/csv" class="sr-only">
      </label>
      <div id="importMsg" class="text-sm mt-3"></div>
      <div id="importPreview" hidden>
        <div class="flex items-center justify-between gap-2 my-2">
          <span id="importSummary" class="text-sm font-bold"></span>
          <div class="flex gap-1 shrink-0 text-sm">
            <button id="importAll" class="tap px-3 rounded-xl bg-slate-100 dark:bg-slate-700" type="button">全部選ぶ</button>
            <button id="importNone" class="tap px-3 rounded-xl bg-slate-100 dark:bg-slate-700" type="button">全部外す</button>
          </div>
        </div>
        <ul id="importList" class="divide-y divide-slate-100 dark:divide-slate-700 max-h-[60vh] overflow-y-auto rounded-xl border border-slate-200 dark:border-slate-700"></ul>
        <button id="importRun" class="tap w-full mt-3 rounded-xl bg-sky-600 text-white font-bold disabled:opacity-60" type="button">取り込む</button>
      </div>
    </div>
  </section>

  <!-- 履歴 -->
  <section class="mb-6">
    <h2 id="historyTitle" class="font-bold mb-2">履歴</h2>
    <div id="history" class="grid gap-3"></div>
  </section>
</div>

<!-- 画面下の切り替えタブ -->
<nav id="viewNav" class="fixed bottom-0 inset-x-0 z-40 border-t border-slate-200 dark:border-slate-700 bg-white/95 dark:bg-slate-900/95 backdrop-blur" hidden>
  <div class="max-w-3xl mx-auto grid grid-cols-2">
    <button id="viewMoney" class="tap py-2 flex flex-col items-center text-xs font-bold" type="button">
      <span class="text-2xl leading-none">💰</span>家計簿
    </button>
    <button id="viewMeal" class="tap py-2 flex flex-col items-center text-xs font-bold" type="button">
      <span class="text-2xl leading-none">🍚</span>栄養管理
    </button>
  </div>
</nav>

<!-- お知らせ（トースト） -->
<div id="toast" class="fixed left-1/2 -translate-x-1/2 z-50 rounded-xl bg-slate-800 text-white dark:bg-slate-100 dark:text-slate-900 px-4 py-3 text-sm shadow-lg" hidden></div>

<script>
/*
 * 家計簿＆カロリー管理 — 画面
 * ・データは Apps Script のウェブアプリに POST で読み書きする（合言葉を URL に出さない）
 * ・前回のデータを端末（localStorage）に控えておき、開いた瞬間に表示 → 裏で最新に差し替える
 * ・ユーザーが入れた文字は textContent で表示する（innerHTML には入れない）
 */

// ウェブアプリの URL（…/exec）。clasp deploy -i で更新すれば変わらない
const API_URL = 'https://script.google.com/macros/s/AKfycbwynDSPlBZ0jIuAKdnaQw-sOOjtXzy3ZH4pMwDXprNKSDfncQs7Xc9-6iFcZ8Q6W7aq/exec';

const KEY_STORE = 'kakeibo-key';
const CACHE_STORE = 'kakeibo-cache';
const VIEW_STORE = 'kakeibo-view';   // 最後に開いていた画面（money / meal）
const CACHE_MONTHS = 12;   // 端末に控えておく月の数

// サーバーから届くまでの仮の値（サーバーの CATEGORIES・DEFAULT_GOALS と同じ）
const DEFAULT_CATEGORIES = {
  '支出': ['食費', '日用品', '交通費', '娯楽', '光熱費', '通信費', 'その他'],
  '収入': ['給与', '副収入', 'その他'],
  '食事': ['朝食', '昼食', '夕食', '間食']
};
const DEFAULT_GOALS = { kcal: 2000, p: 60, f: 55, c: 280 };

/* ---------- 小さな道具 ---------- */

const $ = id => document.getElementById(id);

/** localStorage は使えない場合（プライベートブラウズなど）もあるので、失敗しても止まらないようにする */
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

/** 要素を作る（文字は textContent で入れるので安全） */
function el(tag, className, text) {
  const e = document.createElement(tag);
  if (className) e.className = className;
  if (text != null) e.textContent = text;
  return e;
}

/** 0 埋め */
const pad = n => String(n).padStart(2, '0');

/** Date → yyyy-MM-dd（端末の時刻で） */
function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

/** 今日（yyyy-MM-dd） */
function today() { return ymd(new Date()); }

/** yyyy-MM を n か月ずらす（年またぎも正しく） */
function shiftMonth(month, n) {
  const [y, m] = month.split('-').map(Number);
  const d = new Date(y, m - 1 + n, 1);
  return d.getFullYear() + '-' + pad(d.getMonth() + 1);
}

/** yyyy-MM-dd を n 日ずらす（月またぎ・年またぎも正しく） */
function shiftDay(day, n) {
  const [y, m, d] = day.split('-').map(Number);
  return ymd(new Date(y, m - 1, d + n));
}

/** 「2026年11月」 */
function monthText(month) {
  const [y, m] = month.split('-').map(Number);
  return y + '年' + m + '月';
}

/** 「11月6日（木）」 */
function dayText(day) {
  const [y, m, d] = day.split('-').map(Number);
  const w = '日月火水木金土'[new Date(y, m - 1, d).getDay()];
  return m + '月' + d + '日（' + w + '）';
}

/** 金額の表示「¥1,234」 */
function yen(n) { return '¥' + Math.round(n || 0).toLocaleString('ja-JP'); }

/** 数の表示（小数は1けたまで） */
function num(n) { return (Math.round((n || 0) * 10) / 10).toLocaleString('ja-JP'); }

/** 全角数字・カンマ・空白を直す（サーバーでも同じことをする） */
function normNum(s) {
  return String(s || '').trim()
    .replace(/[０-９．]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
    .replace(/[,，\s]/g, '');
}

/** 入力欄の値を数値に（空や数字でないものは null） */
function readNum(input) {
  const s = normNum(input.value);
  if (s === '' || !/^\d+(\.\d+)?$/.test(s)) return null;
  return Number(s);
}

/** P×4 + F×9 + C×4 */
function pfcToKcal(p, f, c) { return Math.round((p || 0) * 4 + (f || 0) * 9 + (c || 0) * 4); }

/* ---------- 画面の状態 ---------- */

const state = {
  key: '',
  month: today().slice(0, 7),   // 表示中の月
  day: today(),                 // カロリーを表示する日（月と連動）
  records: [],                  // 表示中の月の記録
  goals: Object.assign({}, DEFAULT_GOALS),
  categories: DEFAULT_CATEGORIES,
  view: 'money',                // 表示中の画面：money（家計簿）／ meal（栄養管理）
  moneyKind: '支出',            // お金の入力：支出 / 収入
  editingId: null,              // 編集中の記録の ID（新規なら null）
  kcalManual: false,            // kcal を手で入れたか（入れたら自動計算しない）
  loadSeq: 0,                   // 読み込みの番号（古い返事で上書きしないため）
  lastLoad: 0,
  busy: false
};

/* ---------- 端末の控え（前回のデータ） ---------- */

function readCache() {
  try { return JSON.parse(store.get(CACHE_STORE) || 'null') || { months: {} }; } catch (e) { return { months: {} }; }
}

/** サーバーから届いた月のデータを控える（古い月から捨てて、最大 CACHE_MONTHS か月） */
function saveCache(data) {
  const c = readCache();
  c.months = c.months || {};
  if (data.month && data.records) c.months[data.month] = { records: data.records, at: Date.now() };
  if (data.goals) c.goals = data.goals;
  if (data.categories) c.categories = data.categories;
  const keys = Object.keys(c.months).sort((a, b) => c.months[b].at - c.months[a].at);
  keys.slice(CACHE_MONTHS).forEach(k => { delete c.months[k]; });
  store.set(CACHE_STORE, JSON.stringify(c));
}

/** 控えから、表示中の月を画面に出す（無ければ false） */
function showFromCache() {
  const c = readCache();
  if (c.goals) state.goals = c.goals;
  if (c.categories) state.categories = c.categories;
  const m = c.months && c.months[state.month];
  state.records = m ? m.records : [];
  return !!m;
}

/* ---------- サーバーとのやり取り ---------- */

/**
 * Apps Script を呼ぶ。Content-Type を text/plain にすると、事前の確認通信（プリフライト）が起きない。
 * 失敗したら日本語の理由つきでエラーを投げる。
 */
async function api(action, args) {
  if (!/^https:\/\//.test(API_URL)) throw new Error('index.html の API_URL（ウェブアプリのURL）がまだ設定されていません');
  let res;
  try {
    res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: action, key: state.key, args: args || {} })
    });
  } catch (e) {
    throw new Error('通信できませんでした。電波の状態を確かめて、もう一度お試しください');
  }
  const text = await res.text();
  let data;
  try {
    data = JSON.parse(text);
  } catch (e) {
    throw new Error('サーバーから思わぬ返事が来ました（ウェブアプリのデプロイ設定や権限の承認を確かめてください）');
  }
  if (!data || !data.ok) {
    if (data && data.error === 'bad_key') {
      forgetKey();
      showKeyScreen('合言葉が違います。もう一度入力してください。');
      const err = new Error('合言葉が違います');
      err.badKey = true;
      throw err;
    }
    throw new Error((data && data.message) || 'うまくいきませんでした');
  }
  return data;
}

/** 書き込み・読み込みの返事（月のデータ一式）を画面に反映する */
function applyMonthData(data) {
  saveCache(data);
  if (data.goals) state.goals = data.goals;
  if (data.categories) state.categories = data.categories;
  if (data.month === state.month) state.records = data.records;
  renderAll();
}

/** 表示中の月を最新にする */
async function load() {
  const seq = ++state.loadSeq;
  state.lastLoad = Date.now();
  setSync('loading');
  try {
    const data = await api('load', { month: state.month, day: state.day });
    if (seq !== state.loadSeq) { saveCache(data); return; }   // その間に別の月へ移った
    hideError();
    setSync('');   // 先に「更新中」を消してから描く（空の月が「読み込み中」のままにならないように）
    applyMonthData(data);
  } catch (e) {
    if (seq !== state.loadSeq || e.badKey) return;
    setSync('offline');
    showError(e.message);
    renderHistory();   // 読み込み中の表示を消す
  }
}

/* ---------- 表示：上の部分 ---------- */

function setSync(s) {
  state.syncing = s === 'loading';
  const box = $('syncState');
  box.textContent = '';
  if (s === 'loading') { box.appendChild(el('span', 'spin')); box.appendChild(document.createTextNode(' 更新中')); }
  else if (s === 'offline') box.textContent = '前回の内容を表示中';
}

function showError(msg) { $('errorBox').textContent = msg; $('errorBox').hidden = false; }
function hideError() { $('errorBox').hidden = true; }

let toastTimer = null;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 2500);
}

/* ---------- 表示：ダッシュボード ---------- */

/** 月のお金の集計（食事の金額も食費として支出に入れる。サーバーの moneySummary_ と同じ） */
function moneySummary(records) {
  let income = 0, expense = 0;
  records.forEach(r => {
    if (r.amount == null) return;
    if (r.kind === '収入') income += r.amount; else expense += r.amount;
  });
  return { income, expense, balance: income - expense };
}

/** 指定日の食事の合計（サーバーの mealSummary_ と同じ） */
function mealTotal(records, day) {
  const t = { kcal: 0, p: 0, f: 0, c: 0 };
  records.forEach(r => {
    if (r.kind !== '食事' || r.date !== day) return;
    t.kcal += r.kcal || 0; t.p += r.p || 0; t.f += r.f || 0; t.c += r.c || 0;
  });
  return t;
}

function renderDashboard() {
  $('monthLabel').textContent = monthText(state.month);
  $('moneyTitle').textContent = (state.month === today().slice(0, 7) ? '今月' : monthText(state.month)) + 'のお金';

  const s = moneySummary(state.records);
  $('sumIncome').textContent = yen(s.income);
  $('sumExpense').textContent = yen(s.expense);
  const bal = $('sumBalance');
  bal.textContent = (s.balance > 0 ? '+' : s.balance < 0 ? '−' : '') + yen(Math.abs(s.balance));
  bal.className = 'font-bold text-base sm:text-lg tabular-nums ' +
    (s.balance > 0 ? 'text-emerald-600 dark:text-emerald-400' : s.balance < 0 ? 'text-red-600 dark:text-red-400' : '');

  // カロリー
  $('dayPicker').value = state.day;
  $('mealTitle').textContent = (state.day === today() ? '今日' : dayText(state.day)) + 'の摂取カロリー';
  const t = mealTotal(state.records, state.day);
  const g = state.goals;
  $('kcalTotal').textContent = Math.round(t.kcal).toLocaleString('ja-JP');
  $('kcalGoal').textContent = Math.round(g.kcal).toLocaleString('ja-JP');
  const left = Math.round(g.kcal - t.kcal);
  const leftBox = $('kcalLeft');
  leftBox.textContent = left >= 0 ? 'あと ' + left.toLocaleString('ja-JP') + ' kcal' : Math.abs(left).toLocaleString('ja-JP') + ' kcal オーバー';
  leftBox.className = 'text-xs ' + (left >= 0 ? 'text-slate-500 dark:text-slate-400' : 'text-red-600 dark:text-red-400 font-bold');
  setBar($('kcalBar'), t.kcal, g.kcal, 'bg-sky-500');

  // P・F・C のバー
  const box = $('pfcBars');
  box.textContent = '';
  [['p', 'P たんぱく質', 'bg-rose-400'], ['f', 'F 脂質', 'bg-amber-400'], ['c', 'C 炭水化物', 'bg-emerald-400']].forEach(([k, label, color]) => {
    const row = el('div');
    const head = el('div', 'flex justify-between text-xs mb-1');
    head.appendChild(el('span', '', label));
    head.appendChild(el('span', 'tabular-nums text-slate-500 dark:text-slate-400', num(t[k]) + ' / ' + num(g[k]) + ' g'));
    const track = el('div', 'h-2 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden');
    const bar = el('div', 'bar h-full rounded-full');
    setBar(bar, t[k], g[k], color);
    track.appendChild(bar);
    row.appendChild(head);
    row.appendChild(track);
    box.appendChild(row);
  });
}

/** 進捗バーの長さと色（目標を超えたら赤） */
function setBar(bar, value, goal, color) {
  const pct = goal > 0 ? Math.min(100, value / goal * 100) : 0;
  bar.style.width = pct + '%';
  bar.className = 'bar h-full rounded-full ' + (goal > 0 && value > goal ? 'bg-red-500' : color);
}

/* ---------- 表示：履歴 ---------- */

const BADGE = {
  '支出': 'bg-red-100 text-red-700 dark:bg-red-900/60 dark:text-red-200',
  '収入': 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/60 dark:text-emerald-200',
  '食事': 'bg-orange-100 text-orange-700 dark:bg-orange-900/60 dark:text-orange-200'
};

function renderHistory() {
  const box = $('history');
  box.textContent = '';

  // 家計簿の画面：支出・収入と、金額の入った食事（食費として支出に入るので）
  // 栄養管理の画面：食事だけ
  const meal = state.view === 'meal';
  $('historyTitle').textContent = meal ? monthText(state.month) + 'の食事' : monthText(state.month) + 'のお金の履歴';
  const list = state.records.filter(r => meal ? r.kind === '食事' : (r.kind !== '食事' || r.amount != null));

  if (!list.length) {
    if (state.syncing) {
      const p = el('p', 'text-center text-slate-500 py-8');
      p.appendChild(el('span', 'spin'));
      p.appendChild(document.createTextNode(' 読み込み中…'));
      box.appendChild(p);
    } else {
      box.appendChild(el('p', 'text-center text-slate-500 dark:text-slate-400 py-8 text-sm', monthText(state.month) + 'の記録はまだありません'));
    }
    return;
  }

  // 日付ごとにまとめる（サーバーから日付の新しい順で届く）
  const groups = [];
  list.forEach(r => {
    if (!groups.length || groups[groups.length - 1].date !== r.date) groups.push({ date: r.date, items: [] });
    groups[groups.length - 1].items.push(r);
  });

  groups.forEach(g => {
    const sec = el('section', 'rounded-2xl bg-white dark:bg-slate-800 shadow-sm overflow-hidden');
    const head = el('div', 'flex justify-between items-baseline px-4 py-2 bg-slate-100 dark:bg-slate-700/60 text-sm');
    head.appendChild(el('span', 'font-bold', dayText(g.date)));
    let spend = 0, kcal = 0;
    g.items.forEach(r => { if (r.kind !== '収入') spend += r.amount || 0; if (r.kind === '食事') kcal += r.kcal || 0; });
    const sub = [];
    if (!meal && spend) sub.push('支出 ' + yen(spend));
    if (meal && kcal) sub.push(Math.round(kcal).toLocaleString('ja-JP') + ' kcal');
    if (meal && g.date === state.day) head.className += ' ring-2 ring-inset ring-orange-300 dark:ring-orange-700';   // 表示中の日
    head.appendChild(el('span', 'text-xs text-slate-500 dark:text-slate-300 tabular-nums', sub.join('・')));
    sec.appendChild(head);

    const ul = el('ul', 'divide-y divide-slate-100 dark:divide-slate-700');
    g.items.forEach(r => ul.appendChild(historyRow(r)));
    sec.appendChild(ul);
    box.appendChild(sec);
  });
}

/** 履歴の1行 */
function historyRow(r) {
  const li = el('li', 'flex items-center gap-2 pl-4 pr-1 py-2');
  const main = el('div', 'flex-1 min-w-0');

  const line1 = el('div', 'flex items-center gap-2 min-w-0');
  line1.appendChild(el('span', 'shrink-0 text-xs font-bold rounded-md px-1.5 py-0.5 ' + (BADGE[r.kind] || ''), r.kind));
  line1.appendChild(el('span', 'shrink-0 text-xs text-slate-500 dark:text-slate-400', r.cat));
  line1.appendChild(el('span', 'truncate', r.name || r.cat));
  main.appendChild(line1);

  const info = [];
  if (r.kind === '食事') {
    const pfc = [];
    if (r.p != null) pfc.push('P' + num(r.p));
    if (r.f != null) pfc.push('F' + num(r.f));
    if (r.c != null) pfc.push('C' + num(r.c));
    if (pfc.length) info.push(pfc.join(' '));
  }
  if (r.memo) info.push(r.memo);
  if (info.length) main.appendChild(el('div', 'text-xs text-slate-500 dark:text-slate-400 truncate mt-0.5', info.join('　')));
  li.appendChild(main);

  // 右側：金額・kcal
  const right = el('div', 'text-right shrink-0 tabular-nums');
  if (r.amount != null) {
    right.appendChild(el('div', 'font-bold ' + (r.kind === '収入' ? 'text-emerald-600 dark:text-emerald-400' : ''),
      (r.kind === '収入' ? '+' : '') + yen(r.amount)));
  }
  if (r.kind === '食事' && r.kcal != null) right.appendChild(el('div', 'text-xs text-orange-600 dark:text-orange-300', Math.round(r.kcal).toLocaleString('ja-JP') + ' kcal'));
  li.appendChild(right);

  const edit = el('button', 'tap rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700', '✏️');
  edit.type = 'button';
  edit.setAttribute('aria-label', '編集');
  edit.onclick = () => startEdit(r);
  const del = el('button', 'tap rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700', '🗑️');
  del.type = 'button';
  del.setAttribute('aria-label', '削除');
  del.onclick = () => removeRecord(r, del);
  li.appendChild(edit);
  li.appendChild(del);
  return li;
}

/* ---------- 入力フォーム ---------- */

/** 時間帯から食事区分を選ぶ（初期値） */
function mealByTime() {
  const h = new Date().getHours();
  return h < 10 ? '朝食' : h < 15 ? '昼食' : h < 17 ? '間食' : '夕食';
}

/** select に選択肢を入れる（今の選択はできるだけ残す） */
function fillSelect(sel, items, keep) {
  const cur = keep || sel.value;
  sel.textContent = '';
  items.forEach(v => { const o = el('option', '', v); o.value = v; sel.appendChild(o); });
  if (items.indexOf(cur) >= 0) sel.value = cur;
}

/** 家計簿／栄養管理の画面を切り替える（見せる部分を出し入れするだけ） */
function renderView() {
  const meal = state.view === 'meal';
  $('appTitle').textContent = meal ? '栄養管理' : '家計簿';
  document.title = meal ? '栄養管理' : '家計簿';
  $('monthNav').hidden = meal;
  $('moneyCard').hidden = meal;
  $('dayNav').hidden = !meal;
  $('mealCard').hidden = !meal;
  $('moneyForm').hidden = meal;
  $('mealForm').hidden = !meal;
  $('importArea').hidden = meal;
  const on = 'text-sky-600 dark:text-sky-400';
  const off = 'text-slate-400 dark:text-slate-500';
  $('viewMoney').className = 'tap py-2 flex flex-col items-center text-xs font-bold ' + (meal ? off : on);
  $('viewMeal').className = 'tap py-2 flex flex-col items-center text-xs font-bold ' + (meal ? on : off);
  $('viewMoney').setAttribute('aria-current', meal ? 'false' : 'page');
  $('viewMeal').setAttribute('aria-current', meal ? 'page' : 'false');
}

/** 画面を変える（編集中なら編集をやめる） */
function setView(view) {
  if (state.view === view) return;
  if (state.editingId) cancelEdit();
  state.view = view;
  store.set(VIEW_STORE, view);
  renderAll();
  window.scrollTo(0, 0);
}

function renderForms() {

  // 支出・収入の切り替え
  const exp = state.moneyKind === '支出';
  $('kindExpense').className = 'tap rounded-xl font-bold border ' + (exp ? 'bg-red-500 border-red-500 text-white' : 'border-slate-300 dark:border-slate-600');
  $('kindIncome').className = 'tap rounded-xl font-bold border ' + (!exp ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300 dark:border-slate-600');
  $('kindExpense').setAttribute('aria-pressed', exp);
  $('kindIncome').setAttribute('aria-pressed', !exp);
  fillSelect($('mCat'), state.categories[state.moneyKind] || []);
  fillSelect($('fCat'), state.categories['食事'] || []);

  // 編集中の表示
  $('editBar').hidden = !state.editingId;
  const label = state.editingId ? '更新する' : '記録する';
  if (!state.busy) { $('moneySubmit').textContent = label; $('mealSubmit').textContent = label; }
}

/** PFC から kcal を自動計算（kcal を手で入れたときは何もしない） */
function autoKcal() {
  const p = readNum($('fP')), f = readNum($('fF')), c = readNum($('fC'));
  const has = p != null || f != null || c != null;
  if (!state.kcalManual) {
    $('fKcal').value = has ? String(pfcToKcal(p, f, c)) : '';
    $('kcalHint').textContent = has ? '（P・F・C から自動計算）' : '';
  } else {
    $('kcalHint').textContent = '（手入力）';
  }
}

/** 入力欄を空にする（日付と分類は残す） */
function resetForm(which) {
  if (which === 'money') {
    $('mName').value = ''; $('mAmount').value = ''; $('mMemo').value = '';
  } else {
    ['fName', 'fP', 'fF', 'fC', 'fKcal', 'fAmount', 'fMemo'].forEach(id => { $(id).value = ''; });
    state.kcalManual = false;
    autoKcal();
  }
}

/** 編集をやめる */
function cancelEdit() {
  state.editingId = null;
  resetForm('money');
  resetForm('meal');
  renderForms();
}

/** 履歴の ✏️：その記録をフォームに読み込む */
function startEdit(r) {
  state.editingId = r.id;
  const v = x => (x == null ? '' : String(x));
  state.view = r.kind === '食事' ? 'meal' : 'money';   // 家計簿の画面で食事を直すときは栄養管理へ移る
  store.set(VIEW_STORE, state.view);
  renderAll();
  if (r.kind === '食事') {
    $('fDate').value = r.date; $('fCat').value = r.cat; $('fName').value = r.name;
    $('fP').value = v(r.p); $('fF').value = v(r.f); $('fC').value = v(r.c);
    $('fAmount').value = v(r.amount); $('fMemo').value = r.memo;
    // 保存されている kcal が PFC の計算と違えば「手入力」扱いにする
    const calc = (r.p != null || r.f != null || r.c != null) ? pfcToKcal(r.p, r.f, r.c) : null;
    state.kcalManual = calc == null || calc !== r.kcal;
    $('fKcal').value = v(r.kcal);
    autoKcal();
  } else {
    state.moneyKind = r.kind;
    renderForms();
    $('mDate').value = r.date; $('mCat').value = r.cat; $('mName').value = r.name;
    $('mAmount').value = v(r.amount); $('mMemo').value = r.memo;
  }
  renderForms();
  $('inputArea').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/** 送信中はボタンを押せなくする */
function setBusy(btn, busy) {
  state.busy = busy;
  $('moneySubmit').disabled = busy;
  $('mealSubmit').disabled = busy;
  if (busy) {
    btn.textContent = '';
    btn.appendChild(el('span', 'spin'));
    btn.appendChild(document.createTextNode(' 保存中…'));
  }
}

/** 追加・更新を送る */
async function submitRecord(which) {
  if (state.busy) return;
  let record;
  if (which === 'money') {
    record = {
      kind: state.moneyKind, date: $('mDate').value, cat: $('mCat').value,
      name: $('mName').value, amount: normNum($('mAmount').value), memo: $('mMemo').value
    };
    if (!record.amount) { toast('金額を入れてください'); $('mAmount').focus(); return; }
  } else {
    record = {
      kind: '食事', date: $('fDate').value, cat: $('fCat').value, name: $('fName').value,
      kcal: normNum($('fKcal').value), p: normNum($('fP').value), f: normNum($('fF').value), c: normNum($('fC').value),
      amount: normNum($('fAmount').value), memo: $('fMemo').value
    };
    if (!record.kcal && !record.p && !record.f && !record.c) { toast('kcal か P・F・C を入れてください'); $('fKcal').focus(); return; }
  }
  if (!record.date) { toast('日付を選んでください'); return; }

  const btn = which === 'money' ? $('moneySubmit') : $('mealSubmit');
  const editing = state.editingId;
  setBusy(btn, true);
  try {
    const args = { record: record, month: state.month, day: state.day };
    if (editing) args.id = editing;
    const data = await api(editing ? 'update' : 'add', args);
    hideError();
    applyMonthData(data);
    const other = record.date.slice(0, 7) !== state.month ? '（' + monthText(record.date.slice(0, 7)) + 'の記録）' : '';
    toast((editing ? '更新しました' : '記録しました') + other);
    state.editingId = null;
    resetForm(which);
  } catch (e) {
    if (!e.badKey) { toast(e.message); showError(e.message); }
  } finally {
    setBusy(btn, false);
    renderForms();
  }
}

/** 履歴の 🗑️：確認してから削除 */
async function removeRecord(r, btn) {
  const label = (r.name || r.cat) + '（' + dayText(r.date) + '）';
  if (!confirm('「' + label + '」を削除しますか？\n元に戻せません。')) return;
  btn.disabled = true;
  btn.textContent = '';
  btn.appendChild(el('span', 'spin'));
  try {
    const data = await api('delete', { id: r.id, month: state.month, day: state.day });
    hideError();
    if (state.editingId === r.id) cancelEdit();
    applyMonthData(data);
    toast('削除しました');
  } catch (e) {
    if (!e.badKey) { toast(e.message); showError(e.message); }
    renderHistory();
  }
}

function fillSettings() {
  $('goalKcal').value = state.goals.kcal;
  $('goalP').value = state.goals.p;
  $('goalF').value = state.goals.f;
  $('goalC').value = state.goals.c;
}

async function saveSettings(ev) {
  ev.preventDefault();
  const btn = $('settingsSave');
  btn.disabled = true;
  btn.textContent = '保存中…';

    const data = await api('saveSettings', { goals: {
      kcal: normNum($('goalKcal').value), p: normNum($('goalP').value), f: normNum($('goalF').value), c: normNum($('goalC').value)

    saveCache({ goals: data.goals });
    fillSettings();
    renderDashboard();
    toast('目標を保存しました');
  } catch (e) {
    if (!e.badKey) toast(e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '目標を保存';
  }
}

/** 合言葉と控えを端末から消す */
function forgetKey() {
  store.del(KEY_STORE);
  store.del(CACHE_STORE);
  state.key = '';
  state.records = [];
}

/* ---------- PayPay の取り込み ---------- */

const SHOP_CAT_STORE = 'kakeibo-shop-cat';   // 取引先 → カテゴリ（取り込むたびに覚える）

/** 取引先の名前からカテゴリを当てる決まり（上から順に見る。ガスト→食費 のように、先に書いたほうが勝つ） */
const SHOP_RULES = [
  [/セブン|ファミリーマート|ファミマ|ローソン|ミニストップ|デイリーヤマザキ|セイコーマート|スーパー|イオン|西友|マルエツ|イトーヨーカ|まいばすけっと|オーケー|業務スーパー|マクドナルド|すき家|吉野家|松屋|スターバックス|ドトール|コメダ|ガスト|サイゼリヤ|くら寿司|スシロー|ケンタッキー|モスバーガー|Uber ?Eats|出前館|食堂|カフェ|ベーカリー|弁当/i, '食費'],
  [/マツモトキヨシ|マツキヨ|ウエルシア|ツルハ|スギ薬局|サンドラッグ|ココカラ|ドラッグ|薬局|ダイソー|セリア|キャンドゥ|ニトリ|無印良品|カインズ|コーナン|ドン・キホーテ|ドンキ/i, '日用品'],
  [/JR|鉄道|メトロ|バス|タクシー|駐車|パーキング|ENEOS|出光|ガソリン/i, '交通費'],
  [/電力|でんき|電気|ガス|水道/, '光熱費'],
  [/ドコモ|docomo|ソフトバンク|SoftBank|楽天モバイル|ahamo|povo|LINEMO|ワイモバイル|UQ/i, '通信費'],
  [/映画|シネマ|TOHO|カラオケ|Steam|任天堂|Nintendo|PlayStation|Netflix|Spotify|書店|ブックオフ|アニメイト|タワーレコード/i, '娯楽']
];

const imp = { items: [], busy: false };   // 確認一覧の中身

/** CSV の文字を表（行 × 列の配列）にする（"…" で囲まれたカンマ・改行にも対応） */
function parseCsv(text) {
  const rows = [];
  let row = [], cell = '', quoted = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (quoted) {
      if (ch === '"') {
        if (text[i + 1] === '"') { cell += '"'; i++; } else quoted = false;
      } else cell += ch;
    } else if (ch === '"') quoted = true;
    else if (ch === ',') { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && text[i + 1] === '\n') i++;
      row.push(cell); rows.push(row); row = []; cell = '';
    } else cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ''));
}

/** 「1,234」「¥1,234」などを数にする（無い・「-」は 0） */
function yenNum(s) {
  const t = normNum(s).replace(/[円¥￥]/g, '').replace(/^-/, '');
  return /^\d+$/.test(t) ? Number(t) : 0;
}

/** カテゴリを当てる：覚えたもの → 決まり → その他 */
function guessCat(shop, kind) {
  const cats = state.categories[kind] || [];
  const fallback = cats.indexOf('その他') >= 0 ? 'その他' : cats[0];
  if (kind !== '支出') return fallback;
  let learned = {};
  try { learned = JSON.parse(store.get(SHOP_CAT_STORE) || '{}'); } catch (e) {}
  if (learned[shop] && cats.indexOf(learned[shop]) >= 0) return learned[shop];
  for (const [re, cat] of SHOP_RULES) if (re.test(shop) && cats.indexOf(cat) >= 0) return cat;
  return fallback;
}

/**
 * PayPay の取引履歴 CSV を読む。列は名前で探す（取引日・出金金額（円）・入金金額（円）・取引内容・取引先・取引番号）。
 * 戻り値：{ items, skipped } ／ PayPay の CSV でなければ null
 */
function parsePayPay(text) {
  const rows = parseCsv(String(text).replace(/^﻿/, ''));
  let hi = -1;
  for (let i = 0; i < Math.min(5, rows.length); i++) {
    if (rows[i].some(c => c.replace(/\s/g, '') === '取引番号')) { hi = i; break; }
  }
  if (hi < 0) return null;
  const head = rows[hi].map(c => c.replace(/\s/g, ''));
  const col = name => head.findIndex(h => h.indexOf(name) === 0);
  const c = { date: col('取引日'), out: col('出金金額'), inn: col('入金金額'), kind: col('取引内容'), shop: col('取引先'), no: col('取引番号') };
  if (c.date < 0 || c.no < 0 || (c.out < 0 && c.inn < 0)) return null;

  const items = [];
  let skipped = 0;
  rows.slice(hi + 1).forEach(r => {
    const get = i => (i >= 0 ? String(r[i] == null ? '' : r[i]).trim() : '');
    const m = /(\d{4})\D(\d{1,2})\D(\d{1,2})/.exec(get(c.date));
    const no = get(c.no).replace(/[^0-9A-Za-z_-]/g, '');
    const out = yenNum(get(c.out)), inn = yenNum(get(c.inn));
    const kindText = get(c.kind), shop = get(c.shop);
    if (!m || !no || (!out && !inn) || /チャージ/.test(kindText)) { skipped++; return; }
    const kind = out ? '支出' : '収入';
    items.push({
      importId: 'paypay:' + no,
      date: m[1] + '-' + pad(m[2]) + '-' + pad(m[3]),
      kind: kind,
      amount: out || inn,
      name: shop || kindText || 'PayPay',
      kindText: kindText,
      cat: guessCat(shop, kind),
      // 支払いは最初から選んでおく。送金・出金・入金は自分で選んだときだけ取り込む
      checked: kind === '支出' && !/送金|出金/.test(kindText),
      done: false
    });
  });
  items.sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
  return { items: items, skipped: skipped };
}

function openImport() {
  $('importOpen').hidden = true;
  $('importPanel').hidden = false;
}

function closeImport() {
  imp.items = [];
  $('importFile').value = '';
  $('importMsg').textContent = '';
  $('importPreview').hidden = true;
  $('importPanel').hidden = true;
  $('importOpen').hidden = false;
}

/** ファイルを選んだら読み取って、確認一覧を出す */
async function onImportFile() {
  const file = $('importFile').files[0];
  if (!file) return;
  $('importPreview').hidden = true;
  const msg = $('importMsg');
  msg.className = 'text-sm mt-3';
  msg.textContent = '';
  msg.appendChild(el('span', 'spin'));
  msg.appendChild(document.createTextNode(' 読み取っています…'));

  let parsed = null;
  try {
    parsed = parsePayPay(await file.text());
    // 文字化けで見出しが読めないときは Shift_JIS として読み直す
    if (!parsed && window.TextDecoder) parsed = parsePayPay(new TextDecoder('shift_jis').decode(await file.arrayBuffer()));
  } catch (e) {
    parsed = null;
  }
  if (!parsed) {
    msg.className = 'text-sm mt-3 text-red-600 dark:text-red-400';
    msg.textContent = 'PayPay の取引履歴 CSV として読み取れませんでした。PayPay アプリの「取引履歴のダウンロード」で保存したファイルを選んでください。';
    return;
  }
  if (!parsed.items.length) {
    msg.className = 'text-sm mt-3';
    msg.textContent = '取り込める取引がありませんでした' + (parsed.skipped ? '（チャージなど ' + parsed.skipped + ' 件は対象外）' : '');
    return;
  }

  // 取り込み済みのものに印を付ける（失敗しても、二重登録はサーバーが防ぐので先へ進む）
  try {
    const res = await api('importedIds');
    const done = {};
    res.ids.forEach(id => { done[id] = true; });
    parsed.items.forEach(x => { if (done[x.importId]) { x.done = true; x.checked = false; } });
  } catch (e) {
    if (e.badKey) return;
  }
  imp.items = parsed.items;
  msg.textContent = parsed.skipped ? 'チャージなど ' + parsed.skipped + ' 件は対象外です。' : '';
  renderImport();
}

/** 確認一覧を描く */
function renderImport() {
  const ul = $('importList');
  ul.textContent = '';
  imp.items.forEach(x => {
    const li = el('li', 'px-3 py-2 ' + (x.done ? 'opacity-50' : ''));
    const top = el('label', 'flex items-center gap-3 min-h-[44px] cursor-pointer');
    const cb = el('input', 'w-6 h-6 shrink-0 accent-sky-600');
    cb.type = 'checkbox';
    cb.checked = x.checked;
    cb.disabled = x.done || imp.busy;
    cb.onchange = () => { x.checked = cb.checked; updateImportSummary(); };
    top.appendChild(cb);

    const info = el('div', 'flex-1 min-w-0');
    const l1 = el('div', 'flex items-center gap-2 min-w-0');
    l1.appendChild(el('span', 'shrink-0 text-xs font-bold rounded-md px-1.5 py-0.5 ' + (BADGE[x.kind] || ''), x.kind));
    l1.appendChild(el('span', 'truncate', x.name));
    info.appendChild(l1);
    const [, mm, dd] = x.date.split('-').map(Number);
    info.appendChild(el('div', 'text-xs text-slate-500 dark:text-slate-400', mm + '/' + dd + '　' + x.kindText + (x.done ? '　取り込み済み' : '')));
    top.appendChild(info);
    top.appendChild(el('span', 'shrink-0 font-bold tabular-nums ' + (x.kind === '収入' ? 'text-emerald-600 dark:text-emerald-400' : ''), (x.kind === '収入' ? '+' : '') + yen(x.amount)));
    li.appendChild(top);

    if (!x.done) {
      const sel = el('select', 'field mt-1');
      fillSelect(sel, state.categories[x.kind] || [], x.cat);
      sel.disabled = imp.busy;
      sel.onchange = () => { x.cat = sel.value; };
      sel.setAttribute('aria-label', x.name + ' のカテゴリ');
      li.appendChild(sel);
    }
    ul.appendChild(li);
  });
  $('importPreview').hidden = false;
  updateImportSummary();
}

/** 選んだ件数と合計を出す */
function updateImportSummary() {
  const sel = imp.items.filter(x => x.checked && !x.done);
  let out = 0, inn = 0;
  sel.forEach(x => { if (x.kind === '収入') inn += x.amount; else out += x.amount; });
  const done = imp.items.filter(x => x.done).length;
  $('importSummary').textContent = sel.length + ' 件を選択（支出 ' + yen(out) + (inn ? '・収入 ' + yen(inn) : '') + '）' +
    (done ? '／取り込み済み ' + done + ' 件' : '');
  const btn = $('importRun');
  if (!imp.busy) btn.textContent = sel.length ? sel.length + ' 件を取り込む' : '取り込む';
  btn.disabled = imp.busy || !sel.length;
}

/** 選んだものをまとめて送る */
async function runImport() {
  const sel = imp.items.filter(x => x.checked && !x.done);
  if (!sel.length || imp.busy) return;
  imp.busy = true;
  const btn = $('importRun');
  btn.disabled = true;
  btn.textContent = '';
  btn.appendChild(el('span', 'spin'));
  btn.appendChild(document.createTextNode(' 取り込み中…'));
  try {
    const records = sel.map(x => ({
      kind: x.kind, date: x.date, cat: x.cat, name: x.name.slice(0, 100),
      amount: x.amount, memo: 'PayPay', importId: x.importId
    }));
    const data = await api('importRecords', { records: records, month: state.month, day: state.day });
    // 選んだカテゴリを覚えて、次から最初に選ぶ
    let learned = {};
    try { learned = JSON.parse(store.get(SHOP_CAT_STORE) || '{}'); } catch (e) {}
    sel.forEach(x => { if (x.kind === '支出' && x.name) learned[x.name] = x.cat; });
    store.set(SHOP_CAT_STORE, JSON.stringify(learned));

    hideError();
    applyMonthData(data);
    imp.busy = false;
    closeImport();
    toast(data.added + ' 件を取り込みました' + (data.skipped ? '（' + data.skipped + ' 件は取り込み済み）' : ''));
    if (data.errorCount) {
      showError(data.errorCount + ' 件は取り込めませんでした：' +
        data.errors.map(e => (sel[e.index] ? sel[e.index].name : '') + '（' + e.message + '）').join('、'));
    }
  } catch (e) {
    imp.busy = false;
    if (!e.badKey) { toast(e.message); showError(e.message); }
    updateImportSummary();
  }
}

/** 表示する日を変える（別の月の日なら月も移って読み込む） */
function goDay(d) {
  if (d.slice(0, 7) !== state.month) { goMonth(d.slice(0, 7), d); return; }
  state.day = d;
  renderDashboard();
  renderHistory();   // 表示中の日の印を付け直す
}

/* ---------- 起動 ---------- */

function init() {
  // ?key=… が付いていたら保存して、アドレス欄と履歴から消す
  const qs = new URLSearchParams(location.search);
  if (qs.get('key')) {
    store.set(KEY_STORE, qs.get('key').trim());
    qs.delete('key');
    try { history.replaceState(null, '', location.pathname + (qs.toString() ? '?' + qs : '') + location.hash); } catch (e) {}
  }
  state.key = store.get(KEY_STORE) || '';
  if (store.get(VIEW_STORE) === 'meal') state.view = 'meal';

  // 入力欄の初期値
  $('mDate').value = today();
  $('fDate').value = today();
  fillSelect($('fCat'), DEFAULT_CATEGORIES['食事'], mealByTime());

  // ボタンなど
  $('keyForm').addEventListener('submit', ev => {
    ev.preventDefault();
    const v = $('keyInput').value.trim();
    if (!v) return;
    store.set(KEY_STORE, v);
    state.key = v;
    $('keyMsg').textContent = '確認しています…';
    showApp();
    goMonth(state.month, state.day);
  });
  $('prevMonth').onclick = () => goMonth(shiftMonth(state.month, -1));
  $('nextMonth').onclick = () => goMonth(shiftMonth(state.month, 1));
  $('dayPicker').addEventListener('change', () => {
    const d = $('dayPicker').value;
    if (!d) { $('dayPicker').value = state.day; return; }
    goDay(d);
  });
  $('prevDay').onclick = () => goDay(shiftDay(state.day, -1));
  $('nextDay').onclick = () => goDay(shiftDay(state.day, 1));
  $('todayBtn').onclick = () => goDay(today());
  $('viewMoney').onclick = () => setView('money');
  $('viewMeal').onclick = () => setView('meal');
  $('kindExpense').onclick = () => { state.moneyKind = '支出'; renderForms(); };
  $('kindIncome').onclick = () => { state.moneyKind = '収入'; renderForms(); };
  $('moneyForm').addEventListener('submit', ev => { ev.preventDefault(); submitRecord('money'); });
  $('mealForm').addEventListener('submit', ev => { ev.preventDefault(); submitRecord('meal'); });
  ['fP', 'fF', 'fC'].forEach(id => $(id).addEventListener('input', autoKcal));
  $('fKcal').addEventListener('input', () => {
    state.kcalManual = $('fKcal').value.trim() !== '';   // 空にしたら自動計算に戻る
    if (!state.kcalManual) autoKcal(); else $('kcalHint').textContent = '（手入力）';
  });
  $('editCancel').onclick = cancelEdit;
  $('importOpen').onclick = openImport;
  $('importClose').onclick = closeImport;
  $('importFile').addEventListener('change', onImportFile);
  $('importAll').onclick = () => { imp.items.forEach(x => { if (!x.done) x.checked = true; }); renderImport(); };
  $('importNone').onclick = () => { imp.items.forEach(x => { x.checked = false; }); renderImport(); };
  $('importRun').onclick = runImport;
  $('settingsBtn').onclick = () => { const p = $('settingsPanel'); p.hidden = !p.hidden; if (!p.hidden) fillSettings(); };
  $('settingsForm').addEventListener('submit', saveSettings);
  $('forgetBtn').onclick = () => {
    if (!confirm('この端末から合言葉と前回データの控えを消します。\nスプレッドシートのデータは消えません。よろしいですか？')) return;
    forgetKey();
    $('settingsPanel').hidden = true;
    showKeyScreen('合言葉を消しました。使うときはもう一度入力してください。');
  };

  // 別のアプリから戻ってきたら最新にする（5秒以内の連続は省く）
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && state.key && Date.now() - state.lastLoad > 5000) {
      // 日付が変わっていたら「今日」に合わせる
      const t = today();
      if (state.month === state.lastToday.slice(0, 7) && state.day === state.lastToday && t !== state.lastToday) {
        state.lastToday = t;
        goMonth(t.slice(0, 7), t);
        return;
      }
      load();
    }
  });
  state.lastToday = today();

  if (!state.key) { showKeyScreen(); return; }
  showApp();
  const cached = showFromCache();
  state.syncing = !cached;
  renderAll();
  load();
}

init();
</script>
